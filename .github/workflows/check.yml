name: Qesset episodes notifier

on:
  schedule:
    - cron: "*/30 * * * *"   # كل 30 دقيقة (مستودع خاص: حد 2000 دقيقة شهرياً)
  workflow_dispatch:          # زر تشغيل يدوي للتجربة

permissions:
  contents: write

concurrency:
  group: qesset
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Check for new episodes
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python qesset_notifier.py --once
      - name: Save seen episodes
        run: |
          git config user.name "qesset-bot"
          git config user.email "bot@users.noreply.github.com"
          git add qesset_seen.json
          git diff --cached --quiet || (git commit -m "update seen episodes" && git push)
